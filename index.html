    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-image: url("background.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        position: relative;
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 1;
      }

      .container {
        position: relative;
        z-index: 2;
        text-align: center;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 3rem 2.5rem;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 90%;
        animation: fadeInUp 0.6s ease-out;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        width: 200px;
        max-width: 100%;
        height: auto;
        margin: 0 auto 2.5rem;
        display: block;
        animation: fadeIn 0.8s ease-out;
        object-fit: contain;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      h1 {
        margin-bottom: 2.5rem;
        font-size: 2rem;
        font-weight: 700;
        color: #1a1a1a;
        letter-spacing: -0.5px;
      }

      .download-links {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      a {
        display: block;
        padding: 1.25rem 2rem;
        background: linear-gradient(135deg, #e9b20c 0%, #f5c73d 100%);
        color: #fff;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(233, 178, 12, 0.4);
        position: relative;
        overflow: hidden;
      }

      a::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s;
      }

      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(233, 178, 12, 0.6);
      }

      a:hover::before {
        left: 100%;
      }

      a:active {
        transform: translateY(0);
      }

      @media (max-width: 600px) {
        .container {
          padding: 2rem 1.5rem;
        }

        .logo {
          width: 160px;
          margin-bottom: 2rem;
        }

        h1 {
          font-size: 1.5rem;
          margin-bottom: 2rem;
        }

        a {
          padding: 1rem 1.5rem;
          font-size: 0.9rem;
        }
      }
    </style>
